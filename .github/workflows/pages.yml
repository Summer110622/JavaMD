name: Deploy JavaMD Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and verify static site
        run: bash scripts/build-pages.sh

      - name: Verify root and project-site asset paths
        run: node scripts/test-pages-paths.mjs

      - name: Verify Main.java compile and run behavior
        run: python3 scripts/test-runner.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4

      - name: Download the exact built Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact

      - name: Extract the expected JAR checksums
        run: |
          mkdir -p _expected
          tar -xf _artifact/artifact.tar -C _expected ./vendor/checksums.sha256

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTML, compiler, and favicon
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash scripts/verify-deployment.sh "$PAGES_URL" _expected/vendor/checksums.sha256
